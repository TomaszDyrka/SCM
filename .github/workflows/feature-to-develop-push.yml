name: Test and Push to Develop

on:
  push:
    branches:
      - 'feature/**' 

permissions:
  contents: write
  pull-requests: write

jobs:
  test_and_merge:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run automated tests
        run: |
          pytest

      - name: Merge and Push to develop
        if: success() 
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --base develop --head ${{ github.ref_name }} --title "Auto-merge: ${{ github.ref_name }}" --body "Auto-merge after successful testing" || true
          gh pr merge ${{ github.ref_name }} --merge