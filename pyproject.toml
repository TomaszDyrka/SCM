[project]
name = "rvn"
version = "0.1.0"
description = "Revision Engine Vanguard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.3",
    "toml>=0.10.2",
    "colorama>=0.4.6",
]

[project.scripts]
rvn = "main:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
pythonpath = ["."]
markers = [
    "parser: BaseParser and CLI tests",
    "exampleCommand: ExampleCommand tests",
    "repository: every repository test",
    "modelBlob: every blob model test",
    "modelCommit: every commit model test",
    "modelTree: every tree model test",
    "addCommand: tests for rvn add",
    "initCommand: tests for rvn init",
    "logCommand: tests for rvn log",
    "commitCommand: tests for rvn commit",
    "checkoutCommand: tests for rvn checkout",
    "branchCommand: tests for rvn checkout",
]
